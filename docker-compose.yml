services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: certifly
      POSTGRES_USER: certifly
      POSTGRES_PASSWORD: certifly
    ports:
      - "5432:5432"
    volumes:
      - certifly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certifly -d certifly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  certifly-postgres:
